# Local development stack (PLAN/01 §5.1, environment `local`).
#
# Photos are stored on disk under ./uploads while STORAGE_DRIVER=local. The
# object store is not run at all — see the README for the point at which it has
# to come back.
name: tire

services:
  postgres:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_USER: c26
      POSTGRES_PASSWORD: c26_local_only
      POSTGRES_DB: c26
      # Deterministic collation keeps index behaviour identical across machines.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=en-US --encoding=UTF8"
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U c26 -d c26"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
