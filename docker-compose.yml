# Local development stack (PLAN/01 §5.1, environment `local`).
#
# Photos are stored on disk under ./uploads while STORAGE_DRIVER=local. The
# object store is not run at all — see the README for the point at which it has
# to come back.
#
# ── Explicit port mapping ──────────────────────────────────────────────────────
# Semua port dipetakan secara eksplisit HOST:CONTAINER untuk menghindari bentrok
# dengan service lain di dalam VM. Ubah angka di sisi kiri (HOST) jika port tersebut
# sudah digunakan. Angka di sisi kanan (CONTAINER) adalah port yang digunakan oleh
# aplikasi di dalam container dan TIDAK boleh diubah.
#
#   postgres  →  5433:5432   (VM host 5433 → container PostgreSQL 5432)
#   (API dijalankan secara native via `pnpm dev`, tidak di-containerisasi)
name: tire

services:
  postgres:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_USER: c26
      POSTGRES_PASSWORD: c26_local_only
      POSTGRES_DB: c26
      # Deterministic collation keeps index behaviour identical across machines.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=en-US --encoding=UTF8"
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
    # HOST:CONTAINER — port 5433 di VM host agar tidak bentrok dengan PostgreSQL lain
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U c26 -d c26"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
