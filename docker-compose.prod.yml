# Production topology (PLAN/01 §5). Two processes from one image: the request
# path and the worker never share an event loop — that is the failure isolation
# this system actually needs.
name: commercial2026

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    env_file: .env
    volumes:
      # Photos live here while STORAGE_DRIVER=local. This volume is the single
      # copy of the evidence: it must be in the backup job, and it is the reason
      # the README names a point at which object storage has to come back.
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    env_file: .env
    volumes:
      # The worker builds thumbnails and sweeps retention, so it needs the same
      # directory the API writes to.
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # No published ports. Cloudflare Tunnel reaches Caddy over the container
    # network, so nothing is exposed on the host at all — which is most of the
    # point of using a tunnel.
    expose:
      - "80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps/web/dist:/srv/web:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

  # Publishes tire.zedth.my.id and tire-store.zedth.my.id through Cloudflare.
  # Opt-in: `docker compose --profile tunnel up -d`.
  #
  # Configure both hostnames in the Cloudflare dashboard to point at the same
  # origin, `http://caddy:80`. Caddy decides which is which by Host header, and
  # tire-store answers 404 for everything but the signed upload route.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      # From the Cloudflare dashboard. Belongs in .env, never in this file.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - caddy

volumes:
  postgres-data:
  uploads:
  caddy-data:
  caddy-config:
