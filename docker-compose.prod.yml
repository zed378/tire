# Production topology (PLAN/01 §5).
#
# Three containers and no reverse proxy. cloudflared runs on the VM itself and
# reaches the api container through a loopback-only published port, so nothing
# here is on the public internet except through the tunnel.
#
# The api process does what a proxy used to: serves the built SPA, sets the
# security headers, compresses, and restricts the storage hostname to the signed
# upload route. See apps/api/src/kernel/http/.
#
# Two processes from one image: the request path and the worker never share an
# event loop — that is the failure isolation this system actually needs.
name: commercial2026

services:
  postgres:
    image: postgres:18-alpine
    restart: always
    env_file: .env.prod
    volumes:
      - postgres-data:/var/lib/postgresql/18/docker
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-c26} -d $${POSTGRES_DB:-c26}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: always
    env_file: .env.prod
    # Loopback only. cloudflared on the host is the sole client; binding to
    # 0.0.0.0 would publish the API to the VM's network for no reason.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Photos live here while STORAGE_DRIVER=local. This volume is the single
      # copy of the evidence: it belongs in the backup job, and it is the reason
      # the README names a point at which object storage has to come back.
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  # Everything that must happen once per deployment, in order, before api and
  # worker are allowed to start. api and worker both wait on this completing
  # successfully, so a failure here holds the deployment rather than bringing up
  # a system with empty master data.
  #
  # It used to run `pnpm db:migrate` alone. The seeding was written in
  # docker-entrypoint.sh, which nothing ever executed, so every deployment came
  # up with no provinces, no cities and no tire brands.
  db-init:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: "no"
    env_file: .env.prod
    volumes:
      # The tire and vehicle brand CSVs. Read-only: this is business input, and
      # the seed only ever reads it.
      - ./requirements:/app/requirements:ro
      # The seed does not write photos, but it shares a config module that
      # resolves UPLOAD_DIR, and mounting the real volume keeps this container's
      # view of the filesystem identical to the api container's.
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "pnpm db:migrate && pnpm db:seed:init"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    command: ["node", "dist/worker.js"]
    restart: always
    env_file: .env.prod
    volumes:
      # The worker builds thumbnails and sweeps retention, so it needs the same
      # directory the API writes to.
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      # The worker consumes the pg-boss queues that db-init registers. Starting
      # before they exist is how "no partition of relation job found for row"
      # reached production.
      db-init:
        condition: service_completed_successfully

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    env_file: .env.prod
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  uploads:
  pgadmin-data:
