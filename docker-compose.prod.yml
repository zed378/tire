# Production topology (PLAN/01 §5).
#
# Three containers and no reverse proxy. cloudflared runs on the VM itself and
# reaches the api container through a loopback-only published port, so nothing
# here is on the public internet except through the tunnel.
#
# The api process does what a proxy used to: serves the built SPA, sets the
# security headers, compresses, and restricts the storage hostname to the signed
# upload route. See apps/api/src/kernel/http/.
#
# Two processes from one image: the request path and the worker never share an
# event loop — that is the failure isolation this system actually needs.
name: commercial2026

services:
  postgres:
    image: postgres:18-alpine
    restart: always
    env_file: .env.prod
    volumes:
      - postgres-data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: always
    env_file: .env.prod
    # Loopback only. cloudflared on the host is the sole client; binding to
    # 0.0.0.0 would publish the API to the VM's network for no reason.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Photos live here while STORAGE_DRIVER=local. This volume is the single
      # copy of the evidence: it belongs in the backup job, and it is the reason
      # the README names a point at which object storage has to come back.
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  db-init:
    image: commercial2026-api:latest
    restart: "no"
    env_file: .env.prod
    command: >
      sh -c "
        echo 'Running Prisma migrations...' &&
        cd /app &&
        node ./node_modules/prisma/build/index.js migrate deploy 2>&1 &&
        echo 'Running queue setup...' &&
        node -e \"
          var PgBoss = require('pg-boss');
          (async function() {
            var boss = new PgBoss({ connectionString: process.env.DATABASE_URL, schema: 'pgboss' });
            await boss.start();
            var queues = [
              'outbox.dispatch', 'notification.send', 'photo.thumbnail',
              'export.build', 'upload.orphan-cleanup', 'report.refresh',
              'notification.archive', 'queue.health', 'metrics.daily',
              'inspection.draft-expiry', 'photo.retention-sweep'
            ];
            var policies = {
              'outbox.dispatch': { retryLimit: 3, retryBackoff: true },
              'notification.send': { retryLimit: 5, retryBackoff: true },
              'photo.thumbnail': { retryLimit: 3, retryBackoff: true },
              'export.build': { retryLimit: 2, retryBackoff: true },
              'upload.orphan-cleanup': { retryLimit: 1, retryBackoff: false },
              'report.refresh': { retryLimit: 1, retryBackoff: false },
              'notification.archive': { retryLimit: 1, retryBackoff: false },
              'queue.health': { retryLimit: 0, retryBackoff: false },
              'metrics.daily': { retryLimit: 2, retryBackoff: true },
              'inspection.draft-expiry': { retryLimit: 1, retryBackoff: false },
              'photo.retention-sweep': { retryLimit: 1, retryBackoff: false }
            };
            for (var i = 0; i < queues.length; i++) {
              await boss.createQueue(queues[i], { name: queues[i], retryLimit: policies[queues[i]].retryLimit, retryBackoff: policies[queues[i]].retryBackoff });
            }
            await boss.stop({ graceful: false });
            console.log('  queue schema pgboss ready, ' + String(queues.length) + ' queues registered');
            process.exit(0);
          })();
        \""

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    command: ["node", "dist/worker.js"]
    restart: always
    env_file: .env.prod
    volumes:
      # The worker builds thumbnails and sweeps retention, so it needs the same
      # directory the API writes to.
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  uploads:
